<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>SiL Tahfidz - MTsS Nurul Islam Indonesia</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FAFBF9;
      font-family: system-ui, -apple-system, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .setup-notice {
      display: none;
      max-width: 520px;
      margin: 15vh auto;
      padding: 28px;
      background: #FFFFFF;
      border-top: 5px solid #D4AF37;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(30, 53, 43, 0.12);
      text-align: center;
      color: #1E352B;
    }
    .setup-notice h2 {
      margin-bottom: 12px;
      font-size: 1.35rem;
    }
    .setup-notice p {
      font-size: 0.92rem;
      line-height: 1.6;
      color: #5A6B62;
    }
    code {
      background: #EBF1EE;
      padding: 2px 6px;
      border-radius: 4px;
      color: #1E352B;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="setupBox" class="setup-notice">
    <h2>Konfigurasi URL Google Apps Script</h2>
    <p>
      Silakan buka file <code>index.html</code> di repositori GitHub Anda dan ganti nilai variabel
      <code>GAS_WEB_APP_URL</code> dengan URL Web App hasil deployment dari Google Apps Script Anda.
    </p>
  </div>

  <iframe id="appFrame" title="SiL Tahfidz MTsS Nurul Islam Indonesia" allow="clipboard-write"></iframe>

  <script>
    // TEMPELKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI BAWAH INI:
    // Contoh: "https://script.google.com/macros/s/AKfycbx.../exec"
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxrNNcGmv1pcUClWwhinBStEyown8Ex6vxSA8SXqrWpAtVICi2kxEtoscTYkbLpN9ofiA/exec";

    const frame = document.getElementById("appFrame");
    const setupBox = document.getElementById("setupBox");

    if (GAS_WEB_APP_URL && GAS_WEB_APP_URL.startsWith("https://")) {
      frame.src = GAS_WEB_APP_URL;
    } else {
      frame.style.display = "none";
      setupBox.style.display = "block";
    }
  </script>
</body>
</html>
